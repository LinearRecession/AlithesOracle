services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alithes
      POSTGRES_USER: ${DATABASE_USER:-alithes}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-alithes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-alithes} -d alithes"]
      interval: 5s
      timeout: 3s
      retries: 10

  oracle:
    build: .
    image: alithes-oracle:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/alithes
      DATABASE_USER: ${DATABASE_USER:-alithes}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-alithes}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.14.0}
      ORACLE_SCHEDULER_ENABLED: ${ORACLE_SCHEDULER_ENABLED:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret-change-me}
    restart: unless-stopped

volumes:
  postgres_data:
